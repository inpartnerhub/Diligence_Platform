# clamd in the single-container demo (deploy/huggingface): TCP on 127.0.0.1, same scan limits as compose.yaml.
Foreground yes
DatabaseDirectory /var/lib/clamav
TCPSocket 3310
TCPAddr 127.0.0.1
LogTime yes
StreamMaxLength 100M
MaxFileSize 100M
AlertExceedsMax yes
AlertEncryptedArchive yes
AlertEncryptedDoc no
SelfCheck 3600
