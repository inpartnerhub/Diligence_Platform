; Services of the single-container demo (deploy/huggingface). Every service listens on 127.0.0.1 only, except the
; web app on the Space port 7860. Variables come from /data/.env, exported by start.sh.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/data/run/supervisord.pid
childlogdir=/data/run

[unix_http_server]
file=/data/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///data/run/supervisor.sock

[program:postgres]
command=postgres -D /data/pg -k /data/run -c listen_addresses=127.0.0.1 -c shared_buffers=128MB
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --requirepass "%(ENV_REDIS_PASSWORD)s" --save "" --appendonly no --dir /data/redis
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:rabbitmq]
command=/usr/lib/rabbitmq/bin/rabbitmq-server
environment=RABBITMQ_NODENAME="rabbit@localhost",RABBITMQ_MNESIA_BASE="/data/rabbitmq/mnesia",RABBITMQ_LOG_BASE="/data/rabbitmq/log",RABBITMQ_CONFIG_FILE="/data/rabbitmq/rabbitmq.conf",RABBITMQ_ENABLED_PLUGINS_FILE="/data/rabbitmq/enabled_plugins",ERL_EPMD_ADDRESS="127.0.0.1",RABBITMQ_LOGS="-"
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:object-storage]
command=weed server -dir=/data/s3 -ip=127.0.0.1 -ip.bind=127.0.0.1 -master.port=9333 -volume.port=8082 -filer.port=8888 -s3 -s3.port=9000 -s3.config=/data/s3.json
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:opensearch]
command=/opt/opensearch/bin/opensearch
environment=OPENSEARCH_JAVA_OPTS="-Xms512m -Xmx512m",OPENSEARCH_PATH_CONF="/opt/opensearch/config"
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tika]
command=java -Xmx384m -jar /opt/tika/tika-server.jar -h 127.0.0.1 -p 9998
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:clamav]
command=clamd --foreground --config-file=/etc/clamav/demo-clamd.conf
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gotenberg]
command=gotenberg --api-port=3002 --api-disable-health-check-logging --libreoffice-start-timeout=90s
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:keycloak]
command=/opt/keycloak/bin/kc.sh start-dev --import-realm --http-host=127.0.0.1 --http-port=8180 --http-management-port=9001
environment=KC_BOOTSTRAP_ADMIN_USERNAME="%(ENV_KEYCLOAK_ADMIN_USERNAME)s",KC_BOOTSTRAP_ADMIN_PASSWORD="%(ENV_KEYCLOAK_ADMIN_PASSWORD)s",KC_HEALTH_ENABLED="true",KC_HOSTNAME="http://localhost:8180",KC_HOSTNAME_BACKCHANNEL_DYNAMIC="true",JAVA_OPTS_APPEND="-Xms128m -Xmx512m"
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:backend]
command=/app/start.sh after 127.0.0.1:5432 127.0.0.1:6379 127.0.0.1:5672 127.0.0.1:9000 127.0.0.1:8180 -- java -Xms256m -Xmx768m -XX:+ExitOnOutOfMemoryError -jar /opt/backend/app.jar
environment=SPRING_PROFILES_ACTIVE="local",SERVER_PORT="8080",MANAGEMENT_SERVER_PORT="8081",LOGGING_LEVEL_COM_INPARTNERHUB_DILIGENCE="INFO",LOG_FORMAT="",APP_ENVIRONMENT="demo",DB_URL="jdbc:postgresql://127.0.0.1:5432/%(ENV_POSTGRES_DB)s",DB_USERNAME="%(ENV_POSTGRES_USER)s",DB_PASSWORD="%(ENV_POSTGRES_PASSWORD)s",DB_POOL_SIZE="10",REDIS_HOST="127.0.0.1",RABBITMQ_HOST="127.0.0.1",OIDC_ISSUER_URI="http://localhost:8180/realms/diligence",IDP_BASE_URL="http://localhost:8180",S3_ENDPOINT="http://127.0.0.1:9000",AWS_ACCESS_KEY_ID="%(ENV_S3_ACCESS_KEY_ID)s",AWS_SECRET_ACCESS_KEY="%(ENV_S3_SECRET_ACCESS_KEY)s",OPENSEARCH_URL="http://127.0.0.1:9200",TIKA_URL="http://127.0.0.1:9998",GOTENBERG_URL="http://127.0.0.1:3002",CLAMAV_HOST="127.0.0.1",SMTP_HOST="127.0.0.1",CORS_ALLOWED_ORIGINS="%(ENV_APP_BASE_URL)s",MANAGEMENT_TRACING_ENABLED="false",MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED="false",MANAGEMENT_OTLP_LOGGING_EXPORT_ENABLED="false",MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENABLED="false"
priority=30
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:frontend]
command=node /opt/frontend/server.js
directory=/opt/frontend
environment=NODE_ENV="production",PORT="7860",HOSTNAME="0.0.0.0",API_BASE_URL="http://127.0.0.1:8080",OIDC_ISSUER="http://localhost:8180/realms/diligence",OIDC_INTERNAL_ISSUER="http://localhost:8180/realms/diligence",OIDC_CLIENT_ID="diligence-web",OIDC_ALLOW_HTTP="true",REDIS_URL="redis://:%(ENV_REDIS_PASSWORD)s@127.0.0.1:6379/1",DEMO_PUBLIC="true",TRUSTED_PROXY_HOPS="1",RATE_LIMIT_AUTH_MAX="120",RATE_LIMIT_ACTION_MAX="300"
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:setup]
command=/app/setup.sh
priority=40
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
