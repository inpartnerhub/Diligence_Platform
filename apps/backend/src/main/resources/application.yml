# Production-oriented defaults. Every environment-specific value is injected via environment variables
# (local: .env / docker compose; Kubernetes: ConfigMap + Vault-injected secrets). No secrets live in this file.
spring:
  application:
    name: diligence-backend
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned exclusively by Flyway
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  cache:
    type: redis
    redis:
      time-to-live: 10m
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    template:
      observation-enabled: true # propagate trace context into messages
    listener:
      simple:
        observation-enabled: true
        acknowledge-mode: auto
        default-requeue-rejected: false # failed messages go to the DLQ instead of looping
        retry:
          enabled: true
          max-attempts: 3
  modulith:
    events:
      externalization:
        enabled: true
      republish-outstanding-events-on-restart: true
      # A completed publication is deleted at once (#115): keeping them (the default, UPDATE) grows the table with
      # every event times every listener and keeps the serialized payloads past the project purge (ADM-06).
      # Incomplete and FAILED publications stay for the retry job, the metrics and republishing on restart.
      completion-mode: delete
      # Publications stuck before completion (a replica died mid-way) become FAILED, so the retry job below picks them
      # up (#81). Generous limits: a slow listener must not be marked failed while it still runs.
      staleness:
        published: ${EVENTS_STALE_PUBLISHED:1h}
        processing: ${EVENTS_STALE_PROCESSING:30m}
        resubmitted: ${EVENTS_STALE_RESUBMITTED:30m}
        check-interval: ${EVENTS_STALE_CHECK_INTERVAL:5m}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          audiences: ${OIDC_AUDIENCE:diligence-api}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      # With STARTTLS on, also require it (#127): otherwise a server (or an attacker on the path) that does not offer
      # it gets the credentials and the mail in plaintext. Local Mailpit has no TLS and keeps both off.
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.ssl.checkserveridentity: ${SMTP_STARTTLS:false}
      mail.smtp.ssl.protocols: TLSv1.2 TLSv1.3
      # JavaMail waits forever by default (#126): a stalled SMTP server must not block the notification threads.
      mail.smtp.connectiontimeout: ${SMTP_CONNECT_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${SMTP_READ_TIMEOUT_MS:15000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:15000}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080
  shutdown: graceful
  # Tomcat's RemoteIpValve reads X-Forwarded-For from the right and skips our own proxies (private addresses by
  # default; override with SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES), so entries a caller wrote are ignored.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

diligence:
  events:
    # Failed module listeners (search indexing, notifications, webhooks…) are retried without a restart (#81,
    # runbook failed-events.md): every interval, publications older than min-age with fewer than max-attempts.
    retry:
      interval: ${EVENTS_RETRY_INTERVAL:5m}
      min-age: ${EVENTS_RETRY_MIN_AGE:5m}
      max-attempts: ${EVENTS_RETRY_MAX_ATTEMPTS:24}
      batch-size: ${EVENTS_RETRY_BATCH_SIZE:100}
  identity:
    base-url: ${IDP_BASE_URL:http://localhost:8180}
    realm: ${IDP_REALM:diligence}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:diligence-admin-api}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    web-client-id: ${OIDC_WEB_CLIENT_ID:diligence-web}
    web-redirect-uri: ${APP_BASE_URL:http://localhost:3000}
    invitation-lifespan: 72h
    # Keycloak Admin API calls run inside the user-administration transaction: never wait on it without limit (#126).
    connect-timeout: ${IDP_CONNECT_TIMEOUT:5s}
    read-timeout: ${IDP_READ_TIMEOUT:15s}
  notification:
    from: ${MAIL_FROM:Diligence Platform <no-reply@diligence.local>}
    # Links in notification e-mails point to the web application.
    app-base-url: ${APP_BASE_URL:http://localhost:3000}
  security:
    client-id: ${OIDC_CLIENT_ID:diligence-api}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  object-storage:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:diligence-documents}
    path-style: ${S3_PATH_STYLE:true}
  # Sensitive actions (report release/issue, project purge, IP allow-list, webhooks, role changes) need a sign-in with
  # MFA within this age (#65); the web app then signs the user in again.
  step-up:
    max-age: ${STEP_UP_MAX_AGE:10m}
    # amr value proving the second factor (#160); the realm's OTP form reports "otp".
    mfa-method: ${STEP_UP_MFA_METHOD:otp}
  http:
    # Largest request body that is not a multipart upload (#117); uploads keep spring.servlet.multipart.* (100 MB).
    max-body-size: ${HTTP_MAX_BODY_SIZE:1MB}
    # Multipart uploads one instance accepts at a time (#142): each is buffered in /tmp (up to 100 MB) until the
    # request ends. Keep max × 100 MB well below the pod's /tmp limit (deployment.yaml); more get 503 + Retry-After.
    max-concurrent-uploads: ${HTTP_MAX_CONCURRENT_UPLOADS:8}
  # Per-user API rate limit (#63), on top of Kong's per-IP limit: requests per user and minute, and a stricter limit
  # for search, downloads and exports. Counted in Redis; load tests that reuse one account switch it off.
  rate-limit:
    enabled: ${USER_RATE_LIMIT_ENABLED:true}
    per-minute: ${USER_RATE_LIMIT_PER_MINUTE:600}
    expensive-per-minute: ${USER_RATE_LIMIT_EXPENSIVE_PER_MINUTE:60}
  webhooks:
    # PRD ADM-07: outbound webhooks may only call public HTTPS endpoints (SSRF protection). Local profile only: true.
    allow-insecure-targets: ${WEBHOOKS_ALLOW_INSECURE_TARGETS:false}
    # Signing keys are encrypted at rest with AES-256-GCM (#64). Base64 32-byte keys from Vault
    # (kv/diligence/<env>/backend/application, ADR-0002): openssl rand -base64 32. To rotate, move the current key to
    # _PREVIOUS and set a new one; restarted pods re-encrypt every signing key, then _PREVIOUS can be removed.
    key-encryption-key: ${WEBHOOK_KEY_ENCRYPTION_KEY:}
    previous-key-encryption-key: ${WEBHOOK_KEY_ENCRYPTION_KEY_PREVIOUS:}
    # Delivery logs keep the event payload: delete them after this period, and at once when their project is purged
    # (ADM-06 retention, #90). The cron runs on one replica (ShedLock).
    log-retention: ${WEBHOOK_LOG_RETENTION:P30D}
    log-retention-cron: ${WEBHOOK_LOG_RETENTION_CRON:0 30 2 * * *}
  dataroom:
    # Time zone of the timestamp in viewer watermarks (PRD DOC-04).
    watermark-zone: ${WATERMARK_ZONE:Asia/Jakarta}
    # Largest bulk ZIP download (DOC-05): bounds memory, disk and request time, and limits mass exfiltration.
    bulk-download-max-files: ${BULK_DOWNLOAD_MAX_FILES:500}
    bulk-download-max-size: ${BULK_DOWNLOAD_MAX_SIZE:2GB}
    # Unwatermarked preview pages kept in memory per instance, and pages prefetched ahead of the viewer (DOC-03).
    # Mass-download controls (#62): large bulk downloads need a recent sign-in with MFA, and users downloading more
    # than alert-documents within alert-window are audited and alerted on.
    mass-download:
      step-up-files: ${MASS_DOWNLOAD_STEP_UP_FILES:50}
      step-up-max-age: ${MASS_DOWNLOAD_STEP_UP_MAX_AGE:10m}
      alert-documents: ${MASS_DOWNLOAD_ALERT_DOCUMENTS:200}
      alert-window: ${MASS_DOWNLOAD_ALERT_WINDOW:15m}
    preview-cache:
      max-size: ${PREVIEW_CACHE_MAX_SIZE:64MB}
      ttl: ${PREVIEW_CACHE_TTL:30m}
      prefetch-pages: ${PREVIEW_CACHE_PREFETCH_PAGES:2}
    # Bulk search re-index from PostgreSQL (#80, runbook opensearch-reindex.md): documents per query, largest bulk
    # request, parallel reads of extracted text from S3, and when a run without progress counts as interrupted.
    reindex:
      batch-size: ${SEARCH_REINDEX_BATCH_SIZE:500}
      bulk-max-size: ${SEARCH_REINDEX_BULK_MAX_SIZE:20MB}
      parallelism: ${SEARCH_REINDEX_PARALLELISM:16}
      stale-after: ${SEARCH_REINDEX_STALE_AFTER:10m}
  request:
    # PRD REQ-04: daily reminders for open items due within these days (and overdue ones), in this time zone.
    reminder-cron: ${REQUEST_REMINDER_CRON:0 0 8 * * MON-FRI}
    reminder-zone: ${REQUEST_REMINDER_ZONE:Asia/Jakarta}
    reminder-days-before: ${REQUEST_REMINDER_DAYS_BEFORE:3}
  search:
    url: ${OPENSEARCH_URL:http://localhost:9200}
    username: ${OPENSEARCH_USERNAME:}
    password: ${OPENSEARCH_PASSWORD:}
    index-prefix: ${OPENSEARCH_INDEX_PREFIX:diligence}
  ingestion:
    # Consume the upload queue in this process (#162): false on the API pods, true on diligence-ingestion.
    listener-enabled: ${INGESTION_LISTENER_ENABLED:true}
    tika-url: ${TIKA_URL:http://localhost:9998}
    gotenberg-url: ${GOTENBERG_URL:http://localhost:3002}
    clamav-host: ${CLAMAV_HOST:localhost}
    clamav-port: ${CLAMAV_PORT:3310}
    # Tesseract languages for scanned documents and images (the image must have the trained data installed).
    ocr-languages: ${OCR_LANGUAGES:eng+ind}

# API documentation is off by default so production does not publish a map of the API; the local profile and the
# dev/staging overlays (API_DOCS_ENABLED=true) keep it available (PRD 8.1 API-first).
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${API_DOCS_ENABLED:false}
  default-produces-media-type: application/json
  paths-to-match: /api/**

management:
  server:
    port: 8081 # actuator isolated from public traffic; not routed through Kong
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, modulith
  health:
    mail:
      enabled: false # SMTP outages must not take pods out of rotation
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    distribution:
      # Histogram buckets for the P95 latency alert (PRD Bab 7: pages <= 2 s P95).
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 500ms, 1s, 2s, 3s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    logging:
      endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${APP_ENVIRONMENT:local}
  traces-sample-rate: 0.0 # traces go to OpenTelemetry; Sentry is for errors only
  send-default-pii: false

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs} # JSON logs, shipped to OpenSearch by the log collector
  level:
    root: INFO
    com.inpartnerhub.diligence: ${APP_LOG_LEVEL:INFO}
