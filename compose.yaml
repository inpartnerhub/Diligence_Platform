# Local development stack. Not for production use.
#   docker compose up -d                                  # infrastructure only (requires >= 3.5 GiB Docker VM RAM)
#   docker compose --profile app up -d --build            # + backend & frontend containers
#   docker compose --profile observability up -d          # + Prometheus, Grafana (requires >= 4.0 GiB Docker VM RAM)
name: diligence

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 20s

services:
  # ---------------------------------------------------------------- data & storage
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { <<: *healthcheck, test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"] }

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: { <<: *healthcheck, test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep PONG"] }
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  object-storage:
    # SeaweedFS S3 gateway (S3-compatible, Apache-2.0). MinIO community images are no longer published.
    # Credentials come from .env; the identity file is generated at start-up and never written to the repository.
    image: chrislusf/seaweedfs:4.53
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - printf '{"identities":[{"name":"diligence","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    ports: ["127.0.0.1:${OBJECT_STORAGE_PORT:-9000}:9000"]
    volumes: ["object-storage-data:/data"]
    healthcheck: { <<: *healthcheck, test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/status || exit 1"] }

  object-storage-init:
    image: amazon/aws-cli:2.39.7
    depends_on: { object-storage: { condition: service_healthy } }
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws --endpoint-url http://object-storage:9000 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null
        || aws --endpoint-url http://object-storage:9000 s3 mb "s3://$$S3_BUCKET"
    restart: "no"

  # ---------------------------------------------------------------- processing & integration
  tika:
    # Bundles Tesseract OCR. For Indonesian OCR (PRD DOC-06), see infrastructure/docker/tika.
    image: apache/tika:4.2.0-1-full
    ports: ["127.0.0.1:9998:9998"]

  clamav:
    # Debian variant: multi-arch (amd64 + arm64, e.g. Apple Silicon); the Alpine image is amd64-only.
    image: clamav/clamav-debian:1.5
    environment:
      # Accept streamed uploads up to the platform's 100 MB file limit (clamd's default is 25 MB).
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_MaxFileSize: 100M
      # Unscannable content is not reported clean (#140); same settings as infrastructure/kubernetes/processing.
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncryptedArchive: "yes"
      CLAMD_CONF_AlertEncryptedDoc: "no"
    ports: ["127.0.0.1:3310:3310"]
    volumes: ["clamav-data:/var/lib/clamav"]
    healthcheck: { <<: *healthcheck, start_period: 180s, test: ["CMD", "clamdcheck.sh"] }

  gotenberg:
    # Office/image → PDF renditions for in-browser preview (PRD DOC-03).
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--api-disable-health-check-logging"]
    ports: ["127.0.0.1:3002:3000"]

  mailpit:
    # Catches every e-mail locally (invitations, password reset, notifications). UI: http://localhost:8025
    image: axllent/mailpit:v1.33
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  # ---------------------------------------------------------------- security
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      JAVA_OPTS_APPEND: "-Xms128m -Xmx384m"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Metrics incl. login events for the suspicious-login alerts (PRD Bab 7, 10.1)
      KC_METRICS_ENABLED: "true"
      KC_EVENT_METRICS_USER_ENABLED: "true"
      # Tokens must carry the same issuer whether fetched by the browser or validated in containers.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    depends_on: [mailpit]
    ports: ["127.0.0.1:8180:8180"]
    volumes:
      # Users, credentials and sessions survive `make down` and container recreation (#83). The realm itself is only
      # imported when it does not exist yet: apply changes to diligence-realm.json with `make keycloak-reset`.
      - keycloak-data:/opt/keycloak/data
      - ./infrastructure/docker/keycloak/diligence-realm.json:/opt/keycloak/data/import/diligence-realm.json:ro
      # Breached/common passwords rejected by the realm policy (ADM-02, #65)
      - ./infrastructure/docker/keycloak/password-blacklists:/opt/keycloak/data/password-blacklists:ro
    healthcheck: { <<: *healthcheck, start_period: 60s, test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"] }

  # ---------------------------------------------------------------- applications
  backend:
    profiles: [app]
    build: { context: ., dockerfile: apps/backend/Dockerfile }
    image: diligence-backend:local
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      object-storage-init: { condition: service_completed_successfully }
    environment:
      SPRING_PROFILES_ACTIVE: local
      USER_RATE_LIMIT_ENABLED: ${USER_RATE_LIMIT_ENABLED:-true}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/urandom"
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OIDC_ISSUER_URI: http://localhost:8180/realms/diligence
      # Issuer stays "localhost" (as the browser sees it); keys are fetched over the compose network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8180/realms/diligence/protocol/openid-connect/certs
      S3_ENDPOINT: http://object-storage:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      IDP_BASE_URL: http://keycloak:8180
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      APP_BASE_URL: http://localhost:3000
      SMTP_HOST: mailpit
      TIKA_URL: http://tika:9998
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+ind}
      GOTENBERG_URL: http://gotenberg:3000
      CLAMAV_HOST: clamav
      SENTRY_DSN: ${SENTRY_DSN}
    ports: ["127.0.0.1:${BACKEND_PORT:-8080}:8080", "127.0.0.1:${BACKEND_MANAGEMENT_PORT:-8081}:8081"]

  frontend:
    profiles: [app]
    build:
      context: apps/frontend
      args:
        NEXT_PUBLIC_APP_ENVIRONMENT: ${APP_ENVIRONMENT}
    image: diligence-frontend:local
    depends_on:
      backend: { condition: service_started }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      APP_BASE_URL: http://localhost:3000
      API_BASE_URL: http://backend:8080
      TRUSTED_PROXY_HOPS: "0" # browsers connect to this container directly
      # Browser-facing issuer (redirects, token "iss") vs. the address the server uses for back-channel calls.
      OIDC_ISSUER: http://localhost:8180/realms/diligence
      OIDC_INTERNAL_ISSUER: http://keycloak:8180/realms/diligence
      OIDC_CLIENT_ID: diligence-web
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env and run make keycloak-bootstrap}
      OIDC_ALLOW_HTTP: "true"
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?set SESSION_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:3000"]

  # ---------------------------------------------------------------- observability
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    depends_on: [prometheus]

volumes:
  postgres-data:
  keycloak-data:
    name: diligence-keycloak-data # fixed name for `make keycloak-reset`
  redis-data:
  object-storage-data:
  clamav-data:
  prometheus-data:
  grafana-data:
