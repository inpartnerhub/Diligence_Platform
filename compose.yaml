# Local development stack. Not for production use.
#   docker compose up -d                                  # infrastructure only
#   docker compose --profile app up -d --build            # + backend & frontend containers
#   docker compose --profile observability up -d          # + Prometheus, Grafana, OTel Collector, Dashboards
name: diligence

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 20s

services:
  # ---------------------------------------------------------------- data & storage
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { <<: *healthcheck, test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"] }

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: { <<: *healthcheck, test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep PONG"] }
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  object-storage:
    # SeaweedFS S3 gateway (S3-compatible, Apache-2.0). MinIO community images are no longer published.
    # Credentials come from .env; the identity file is generated at start-up and never written to the repository.
    image: chrislusf/seaweedfs:4.50
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - printf '{"identities":[{"name":"diligence","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    ports: ["127.0.0.1:${OBJECT_STORAGE_PORT:-9000}:9000"]
    volumes: ["object-storage-data:/data"]
    healthcheck: { <<: *healthcheck, test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/status || exit 1"] }

  object-storage-init:
    image: amazon/aws-cli:2.39.1
    depends_on: { object-storage: { condition: service_healthy } }
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws --endpoint-url http://object-storage:9000 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null
        || aws --endpoint-url http://object-storage:9000 s3 mb "s3://$$S3_BUCKET"
    restart: "no"

  opensearch:
    image: opensearchproject/opensearch:3
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS}
    ulimits: { memlock: { soft: -1, hard: -1 }, nofile: { soft: 65536, hard: 65536 } }
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["opensearch-data:/usr/share/opensearch/data"]
    healthcheck: { <<: *healthcheck, test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"] }

  # ---------------------------------------------------------------- processing & integration
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck: { <<: *healthcheck, test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"] }

  tika:
    # The -full image bundles Tesseract OCR, used automatically for image-based documents.
    image: apache/tika:3.2.3.0-full
    ports: ["127.0.0.1:9998:9998"]

  clamav:
    image: clamav/clamav:1.5
    ports: ["127.0.0.1:3310:3310"]
    volumes: ["clamav-data:/var/lib/clamav"]
    healthcheck: { <<: *healthcheck, start_period: 180s, test: ["CMD", "clamdcheck.sh"] }

  gotenberg:
    # Office/image → PDF renditions for in-browser preview (PRD DOC-03).
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--api-disable-health-check-logging"]
    ports: ["127.0.0.1:3002:3000"]

  mailpit:
    # Catches every e-mail locally (invitations, password reset, notifications). UI: http://localhost:8025
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  # ---------------------------------------------------------------- security
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Tokens must carry the same issuer whether fetched by the browser or validated in containers.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    depends_on: [mailpit]
    ports: ["127.0.0.1:8180:8180"]
    volumes: ["./infrastructure/docker/keycloak/diligence-realm.json:/opt/keycloak/data/import/diligence-realm.json:ro"]
    healthcheck: { <<: *healthcheck, start_period: 60s, test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"] }

  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_TRACING_INSTRUMENTATIONS: all
      KONG_TRACING_SAMPLING_RATE: "1.0"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./infrastructure/docker/kong/kong.yml:/kong/kong.yml:ro"]
    healthcheck: { <<: *healthcheck, test: ["CMD", "kong", "health"] }

  vault:
    # Dev mode: in-memory, auto-unsealed. Mirrors the secret layout used in real environments.
    image: hashicorp/vault:1.20
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
    cap_add: [IPC_LOCK]
    ports: ["127.0.0.1:8200:8200"]

  # ---------------------------------------------------------------- applications
  backend:
    profiles: [app]
    build: { context: ., dockerfile: apps/backend/Dockerfile }
    image: diligence-backend:local
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      object-storage-init: { condition: service_completed_successfully }
    environment:
      SPRING_PROFILES_ACTIVE: local
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      OIDC_ISSUER_URI: http://localhost:8180/realms/diligence
      # Issuer stays "localhost" (as the browser sees it); keys are fetched over the compose network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8180/realms/diligence/protocol/openid-connect/certs
      S3_ENDPOINT: http://object-storage:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      OPENSEARCH_URL: http://opensearch:9200
      IDP_BASE_URL: http://keycloak:8180
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      APP_BASE_URL: http://localhost:3000
      SMTP_HOST: mailpit
      TIKA_URL: http://tika:9998
      GOTENBERG_URL: http://gotenberg:3000
      CLAMAV_HOST: clamav
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      SENTRY_DSN: ${SENTRY_DSN}
    ports: ["127.0.0.1:${BACKEND_PORT:-8080}:8080", "127.0.0.1:${BACKEND_MANAGEMENT_PORT:-8081}:8081"]

  frontend:
    profiles: [app]
    build:
      context: apps/frontend
      args:
        NEXT_PUBLIC_APP_ENVIRONMENT: ${APP_ENVIRONMENT}
    image: diligence-frontend:local
    depends_on:
      kong: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      APP_BASE_URL: http://localhost:3000
      API_BASE_URL: http://kong:8000
      # Browser-facing issuer (redirects, token "iss") vs. the address the server uses for back-channel calls.
      OIDC_ISSUER: http://localhost:8180/realms/diligence
      OIDC_INTERNAL_ISSUER: http://keycloak:8180/realms/diligence
      OIDC_CLIENT_ID: diligence-web
      OIDC_ALLOW_HTTP: "true"
      SESSION_SECRET: ${SESSION_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:3000"]

  # ---------------------------------------------------------------- observability
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infrastructure/docker/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    depends_on: [opensearch]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.7.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL: grafana-opensearch-datasource
    volumes:
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    depends_on: [prometheus]

  opensearch-dashboards:
    profiles: [observability]
    image: opensearchproject/opensearch-dashboards:3
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports: ["127.0.0.1:5601:5601"]
    depends_on: [opensearch]

volumes:
  postgres-data:
  redis-data:
  object-storage-data:
  opensearch-data:
  rabbitmq-data:
  clamav-data:
  prometheus-data:
  grafana-data:
