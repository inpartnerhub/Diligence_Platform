# Local development stack. Not for production use.
#   docker compose up -d                                  # infrastructure only
#   docker compose --profile app up -d --build            # + backend & frontend containers
#   docker compose --profile observability up -d          # + Prometheus, Grafana, OTel Collector, Dashboards
name: platform

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 20s

services:
  # ---------------------------------------------------------------- data & storage
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { <<: *healthcheck, test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"] }

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: { <<: *healthcheck, test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep PONG"] }
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck: { <<: *healthcheck, test: ["CMD", "mc", "ready", "local"] }

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: { minio: { condition: service_healthy } }
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        && mc mb --ignore-existing "local/$$S3_BUCKET"
        && mc anonymous set none "local/$$S3_BUCKET"
    restart: "no"

  opensearch:
    image: opensearchproject/opensearch:3
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS}
    ulimits: { memlock: { soft: -1, hard: -1 }, nofile: { soft: 65536, hard: 65536 } }
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["opensearch-data:/usr/share/opensearch/data"]
    healthcheck: { <<: *healthcheck, test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"] }

  # ---------------------------------------------------------------- processing & integration
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck: { <<: *healthcheck, test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"] }

  tika:
    # The -full image bundles Tesseract OCR, used automatically for image-based documents.
    image: apache/tika:3.2.3.0-full
    ports: ["127.0.0.1:9998:9998"]

  clamav:
    image: clamav/clamav:1.4
    ports: ["127.0.0.1:3310:3310"]
    volumes: ["clamav-data:/var/lib/clamav"]
    healthcheck: { <<: *healthcheck, start_period: 180s, test: ["CMD", "clamdcheck.sh"] }

  # ---------------------------------------------------------------- security
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Tokens must carry the same issuer whether fetched by the browser or validated in containers.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["127.0.0.1:8180:8180"]
    volumes: ["./infrastructure/docker/keycloak/platform-realm.json:/opt/keycloak/data/import/platform-realm.json:ro"]
    healthcheck: { <<: *healthcheck, start_period: 60s, test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"] }

  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_TRACING_INSTRUMENTATIONS: all
      KONG_TRACING_SAMPLING_RATE: "1.0"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./infrastructure/docker/kong/kong.yml:/kong/kong.yml:ro"]
    healthcheck: { <<: *healthcheck, test: ["CMD", "kong", "health"] }

  vault:
    # Dev mode: in-memory, auto-unsealed. Mirrors the secret layout used in real environments.
    image: hashicorp/vault:1.20
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
    cap_add: [IPC_LOCK]
    ports: ["127.0.0.1:8200:8200"]

  # ---------------------------------------------------------------- applications
  backend:
    profiles: [app]
    build: { context: ., dockerfile: apps/backend/Dockerfile }
    image: platform-backend:local
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      SPRING_PROFILES_ACTIVE: local
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      OIDC_ISSUER_URI: http://localhost:8180/realms/platform
      # Issuer stays "localhost" (as the browser sees it); keys are fetched over the compose network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8180/realms/platform/protocol/openid-connect/certs
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      OPENSEARCH_URL: http://opensearch:9200
      TIKA_URL: http://tika:9998
      CLAMAV_HOST: clamav
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      SENTRY_DSN: ${SENTRY_DSN}
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8081:8081"]

  frontend:
    profiles: [app]
    build:
      context: apps/frontend
      args:
        NEXT_PUBLIC_OIDC_ISSUER: http://localhost:8180/realms/platform
        NEXT_PUBLIC_OIDC_CLIENT_ID: platform-frontend
        NEXT_PUBLIC_APP_ENVIRONMENT: ${APP_ENVIRONMENT}
    image: platform-frontend:local
    depends_on: [kong]
    environment:
      API_BASE_URL: http://kong:8000
    ports: ["127.0.0.1:3000:3000"]

  # ---------------------------------------------------------------- observability
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infrastructure/docker/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    depends_on: [opensearch]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.7.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL: grafana-opensearch-datasource
    volumes:
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]

  opensearch-dashboards:
    profiles: [observability]
    image: opensearchproject/opensearch-dashboards:3
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports: ["127.0.0.1:5601:5601"]
    depends_on: [opensearch]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  opensearch-data:
  rabbitmq-data:
  clamav-data:
  prometheus-data:
  grafana-data:
