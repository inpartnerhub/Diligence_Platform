apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: OpenSearch Logs
    uid: opensearch-logs
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    jsonData:
      database: "logs-*"
      timeField: "@timestamp"
      flavor: opensearch
      version: "3.0.0"
  - name: OpenSearch Traces
    uid: opensearch-traces
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    jsonData:
      database: "otel-v1-apm-span-*"
      timeField: "startTime"
      flavor: opensearch
      version: "3.0.0"
