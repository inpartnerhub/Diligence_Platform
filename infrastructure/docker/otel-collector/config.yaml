# Receives OTLP from backend and Kong. Traces and logs go to OpenSearch; metrics are scraped by Prometheus directly.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: "0.0.0.0:4317" }
      http: { endpoint: "0.0.0.0:4318" }

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}
  attributes/scrub:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }

exporters:
  opensearch/traces:
    http: { endpoint: "http://opensearch:9200" }
    traces_index: otel-v1-apm-span-default
  opensearch/logs:
    http: { endpoint: "http://opensearch:9200" }
    logs_index: logs-diligence
  debug:
    verbosity: basic

extensions:
  health_check: { endpoint: "0.0.0.0:13133" }

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull: { exporter: { prometheus: { host: 0.0.0.0, port: 8888 } } }
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [opensearch/traces]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [opensearch/logs]
