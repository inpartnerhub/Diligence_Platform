global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

scrape_configs:
  - job_name: diligence-backend
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["backend:8081"] }]
  - job_name: kong
    static_configs: [{ targets: ["kong:8100"] }]
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"] }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8888"] }]
