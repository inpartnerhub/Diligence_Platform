global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # No hardcoded environment label: this file is shared by the local stack and the single-server prod observability
  # profile, so a static value would mislabel one of them. Set the environment via remote-write/federation if needed.

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: diligence-backend
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["backend:8081"] }]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs: [{ targets: ["keycloak:9000"] }]
