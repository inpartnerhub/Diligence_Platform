# Kong declarative (DB-less) configuration — local development.
# Kong is the single ingress for API traffic: routing, rate limiting, request size limits, correlation IDs,
# metrics and tracing. Token validation is enforced by the backend (zero-trust: never rely on the edge alone).
_format_version: "3.0"
_transform: true

services:
  - name: diligence-backend
    url: http://backend:8080
    connect_timeout: 5000
    read_timeout: 60000
    write_timeout: 60000
    retries: 0
    routes:
      - name: diligence-api-v1
        paths: ["/api/v1"]
        strip_path: false
        protocols: ["http", "https"]
    plugins:
      - name: rate-limiting
        config:
          minute: 600
          policy: local
          limit_by: ip
      - name: request-size-limiting
        config:
          allowed_payload_size: 100
          size_unit: megabytes

plugins:
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      upstream_health_metrics: true
  - name: opentelemetry
    config:
      traces_endpoint: http://otel-collector:4318/v1/traces
      resource_attributes:
        service.name: kong
  - name: response-transformer
    config:
      remove:
        headers: ["X-Powered-By", "Server"]
