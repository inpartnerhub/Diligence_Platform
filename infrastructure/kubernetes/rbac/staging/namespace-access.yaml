# The overlay contains its Namespace object; kubectl apply reads and patches it. Only this one namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: diligence-deployer-namespace-staging
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [diligence-staging]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: diligence-deployer-namespace-staging
subjects:
  - { kind: Group, name: diligence-deployer, apiGroup: rbac.authorization.k8s.io }
roleRef: { kind: ClusterRole, name: diligence-deployer-namespace-staging, apiGroup: rbac.authorization.k8s.io }
