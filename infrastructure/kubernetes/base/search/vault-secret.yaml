# Vault role diligence-opensearch-bootstrap: read-only on kv/diligence/<env>/opensearch-admin, bound to this service
# account. No other workload's Vault role may read that path.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: opensearch-bootstrap
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: diligence-opensearch-bootstrap
    serviceAccount: opensearch-bootstrap
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: opensearch-admin
spec:
  vaultAuthRef: opensearch-bootstrap
  type: kv-v2
  mount: kv
  path: diligence/base/opensearch-admin # replaced per overlay
  refreshAfter: 300s
  destination:
    name: opensearch-admin
    create: true
