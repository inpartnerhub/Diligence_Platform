apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-bootstrap
  labels: { app.kubernetes.io/name: opensearch-bootstrap }
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app.kubernetes.io/name: opensearch-bootstrap }
    spec:
      serviceAccountName: opensearch-bootstrap
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10101
        runAsGroup: 10101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          # Our GHCR Debian image that already ships curl (GHCR is the only trusted registry, .trivy/data); only curl
          # is used here. Pinned like the processing images (#166).
          image: ghcr.io/inpartnerhub/diligence-gotenberg:main
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              api="$OPENSEARCH_URL/_plugins/_security/api"
              put() { # path, JSON body on stdin
                curl -fsS --retry 5 --retry-all-errors -m 30 -X PUT "$api/$1" \
                  -u "$OPENSEARCH_MASTER_USERNAME:$OPENSEARCH_MASTER_PASSWORD" \
                  -H 'Content-Type: application/json' --data-binary @- > /dev/null
                echo "PUT $1"
              }
              # The backend's index only: create it, update its mapping, refresh, index, bulk, search and
              # delete_by_query (search/internal/OpenSearchIndex). No security API, no other indices.
              put roles/diligence_backend <<JSON
              {"cluster_permissions": ["cluster_composite_ops"],
               "index_permissions": [{"index_patterns": ["${OPENSEARCH_INDEX_PREFIX}-*"],
                                      "allowed_actions": ["crud", "create_index", "manage"]}]}
              JSON
              printf '{"password": "%s", "backend_roles": []}' "$OPENSEARCH_APP_PASSWORD" \
                | put "internalusers/$OPENSEARCH_APP_USERNAME"
              put rolesmapping/diligence_backend <<JSON
              {"users": ["$OPENSEARCH_APP_USERNAME"]}
              JSON
          envFrom:
            - secretRef: { name: opensearch-admin }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
