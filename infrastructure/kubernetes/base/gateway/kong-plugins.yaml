# Kong Ingress Controller plugins (mirrors infrastructure/docker/kong/kong.yml).
# limit_by: ip counts per browser only when Kong itself trusts the frontend pods' X-Forwarded-For: the Kong
# release must set trusted_ips / real_ip_header / real_ip_recursive (docs/security/client-addresses.md).
# Without them every user behind the BFF shares the frontend pods' bucket.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: diligence-rate-limiting
plugin: rate-limiting
config:
  minute: 600
  # Counters per Kong proxy replica (#139): the effective limit per address is minute × proxy replicas. "redis"
  # would share them, but needs config.redis (host, TLS, a password from a secret) for this environment's Redis;
  # without it Kong rejects the plugin and no per-address limit applies. The CI check in infrastructure.yml fails
  # a redis policy without a host.
  policy: local
  limit_by: ip
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: diligence-request-size
plugin: request-size-limiting
config:
  allowed_payload_size: 100
  size_unit: megabytes
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: diligence-correlation-id
plugin: correlation-id
config:
  header_name: X-Request-Id
  generator: uuid
  echo_downstream: true
