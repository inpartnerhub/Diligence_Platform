# Kong Ingress Controller plugins (mirrors infrastructure/docker/kong/kong.yml).
# limit_by: ip counts per browser only when Kong itself trusts the frontend pods' X-Forwarded-For: the Kong
# release must set trusted_ips / real_ip_header / real_ip_recursive (docs/security/client-addresses.md).
# Without them every user behind the BFF shares the frontend pods' bucket.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: diligence-rate-limiting
plugin: rate-limiting
config:
  minute: 600
  limit_by: ip
  # Counters shared by every Kong proxy replica through the environment's Redis (#150), so the limit is 600 per
  # address and minute however many replicas run. Host, user and password come from the diligence-gateway-redis secret
  # (configPatches below); TLS as for the backend. Database 1 keeps Kong's keys apart from the backend's (0).
  # If Redis is unreachable, requests pass (fault_tolerant) and the backend's per-user limit still applies.
  policy: redis
  fault_tolerant: true
  redis:
    port: 6379
    database: 1
    ssl: true
    ssl_verify: true
    timeout: 2000
configPatches:
  - path: /redis/host
    valueFrom:
      secretKeyRef: { name: diligence-gateway-redis, key: host }
  - path: /redis/server_name
    valueFrom:
      secretKeyRef: { name: diligence-gateway-redis, key: host }
  - path: /redis/username
    valueFrom:
      secretKeyRef: { name: diligence-gateway-redis, key: username }
  - path: /redis/password
    valueFrom:
      secretKeyRef: { name: diligence-gateway-redis, key: password }
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: diligence-request-size
plugin: request-size-limiting
config:
  allowed_payload_size: 100
  size_unit: megabytes
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: diligence-correlation-id
plugin: correlation-id
config:
  header_name: X-Request-Id
  generator: uuid
  echo_downstream: true
