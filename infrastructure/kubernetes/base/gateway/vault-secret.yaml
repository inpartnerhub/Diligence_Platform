# Redis connection for Kong's shared rate-limit counters (#150). Same Vault path and VaultAuth as the backend's
# infrastructure secret (Terraform writes REDIS_HOST / REDIS_PASSWORD there, stacks/diligence/main.tf), but the
# destination keeps only the two Redis values, so the Kong Ingress Controller never reads the database, RabbitMQ or
# OpenSearch credentials. Values are rendered as JSON strings: KongPlugin configPatches parse the secret value as
# JSON. The overlays point spec.path at their environment.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: diligence-gateway-redis
spec:
  vaultAuthRef: diligence-backend
  type: kv-v2
  mount: kv
  path: diligence/base/backend/infrastructure
  refreshAfter: 60s
  destination:
    name: diligence-gateway-redis
    create: true
    labels:
      # Lets the Kong Ingress Controller read the secret for configPatches (KIC 3.x watches labelled secrets only).
      konghq.com/secret: "true"
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        host:
          text: '{{ get .Secrets "REDIS_HOST" | toJson }}'
        password:
          text: '{{ get .Secrets "REDIS_PASSWORD" | toJson }}'
