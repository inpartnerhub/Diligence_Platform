apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diligence-api
  annotations:
    konghq.com/plugins: diligence-rate-limiting,diligence-request-size,diligence-correlation-id
    konghq.com/protocols: https
    konghq.com/https-redirect-status-code: "308"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: kong
  tls:
    - hosts: [api.example.com]
      secretName: diligence-api-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend: { service: { name: diligence-backend, port: { name: http } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diligence-web
  annotations:
    konghq.com/plugins: diligence-correlation-id
    konghq.com/protocols: https
    konghq.com/https-redirect-status-code: "308"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: kong
  tls:
    - hosts: [app.example.com]
      secretName: diligence-web-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: diligence-frontend, port: { name: http } } }
