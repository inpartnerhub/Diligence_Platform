# Requires the Prometheus Operator (kube-prometheus-stack). Same rules as infrastructure/docker/prometheus/alerts.yml
# (PRD Bab 7 alerts for error rate, latency and suspicious logins; Bab 10.1 anomalous logins) — keep both in sync.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: diligence-alerts
spec:
  groups:
    - name: diligence-availability
      rules:
        - alert: DiligenceBackendDown
          expr: up{job="diligence-backend"} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: Backend instance {{ $labels.instance }} is not scraped
            runbook: docs/runbooks/backend-unavailable.md
        - alert: DiligenceKeycloakDown
          # Job names differ between compose and the Kubernetes releases of Keycloak, Kong and RabbitMQ: match by pattern.
          expr: max by (job) (up{job=~".*keycloak.*"}) == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "Keycloak ({{ $labels.job }}) is not scraped: sign-in and token refresh fail"
            runbook: docs/runbooks/keycloak-outage.md
        - alert: DiligenceGatewayDown
          expr: max by (job) (up{job=~".*kong.*"}) == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "Kong ({{ $labels.job }}) is not scraped: the web app and the API are unreachable"
            runbook: docs/runbooks/backend-unavailable.md
        - alert: DiligenceMessageBrokerDown
          # Self-hosted RabbitMQ only; a managed broker (Amazon MQ) is watched through the cloud provider's monitoring.
          expr: max by (job) (up{job=~".*rabbitmq.*"}) == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "RabbitMQ ({{ $labels.job }}) is not scraped: uploads are not scanned or processed"
            runbook: docs/runbooks/dead-letter-queue.md

    - name: diligence-api
      rules:
        - alert: DiligenceHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{job="diligence-backend",status=~"5..",uri!~"/actuator.*"}[5m]))
              / clamp_min(sum(rate(http_server_requests_seconds_count{job="diligence-backend",uri!~"/actuator.*"}[5m])), 1e-9)
              > 0.05
          for: 10m
          labels: { severity: critical }
          annotations:
            summary: More than 5% of API requests fail with 5xx
            runbook: docs/runbooks/backend-unavailable.md
        - alert: DiligenceSlowApi
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_server_requests_seconds_bucket{job="diligence-backend",uri!~"/actuator.*"}[5m]))) > 2
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: API P95 latency above 2 s (PRD Bab 7 target)
            runbook: docs/runbooks/slow-api.md
        - alert: DiligenceDatabasePoolExhausted
          expr: max(hikaricp_connections_pending{job="diligence-backend"}) > 5
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: Requests are waiting for database connections
            runbook: docs/runbooks/slow-api.md

    - name: diligence-security
      rules:
        - alert: DiligenceLoginFailureSpike
          # Keycloak event metrics (KC_EVENT_METRICS_USER_ENABLED): failed logins across the realm.
          expr: sum(rate(keycloak_user_events_total{event="login",error!=""}[5m])) * 300 > 30
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: More than 30 failed logins in 5 minutes — possible password spraying
            runbook: docs/runbooks/suspicious-login.md
        - alert: DiligenceAccountLockouts
          expr: sum(increase(keycloak_user_events_total{event="login",error="user_temporarily_disabled"}[15m])) > 5
          labels: { severity: warning }
          annotations:
            summary: Several accounts were locked by brute-force protection
            runbook: docs/runbooks/suspicious-login.md
        - alert: DiligenceProjectAccessBlocked
          expr: sum(increase(diligence_project_access_blocked_total[15m])) > 0
          labels: { severity: warning }
          annotations:
            summary: External users tried to open a project from outside its IP allow-list
            runbook: docs/runbooks/suspicious-login.md
        - alert: DiligenceMassDownload
          # A user downloaded more documents within the window than diligence.dataroom.mass-download.alert-documents.
          expr: sum(increase(diligence_dataroom_mass_download_total[15m])) > 0
          labels: { severity: critical }
          annotations:
            summary: A user downloaded an unusually large number of documents — possible data exfiltration
            runbook: docs/runbooks/suspicious-login.md
        - alert: DiligenceRateLimitedUsers
          # Requests refused by the per-user rate limit (#63): scraping, a runaway script or a stolen session.
          expr: sum by (tier) (increase(diligence_ratelimit_rejected_total[10m])) > 50
          labels: { severity: warning }
          annotations:
            summary: Many requests refused by the per-user rate limit ({{ $labels.tier }})
            runbook: docs/runbooks/suspicious-login.md
        - alert: DiligenceForbiddenSpike
          # Many 403/404 answers from one service can mean someone probes other projects' IDs (IDOR).
          expr: sum(rate(http_server_requests_seconds_count{job="diligence-backend",status=~"403|404"}[5m])) * 300 > 200
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: Unusually many 403/404 responses — possible access probing
            runbook: docs/runbooks/suspicious-login.md
        - alert: DiligenceMalwareDetected
          # The virus scanner found an infected upload (#86). The version is quarantined; someone must find out why.
          expr: sum(increase(diligence_dataroom_malware_detected_total[15m])) > 0
          labels: { severity: warning }
          annotations:
            summary: Malware was found in an uploaded document; the file is quarantined
            runbook: docs/runbooks/malware-detected.md

    - name: diligence-pipeline
      rules:
        - alert: DiligenceMessagesStuck
          expr: sum(rabbitmq_queue_messages_ready) > 1000
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: Document processing queue is backing up (scan, OCR, preview)
            runbook: docs/runbooks/dead-letter-queue.md
        - alert: DiligenceEventsFailing
          # Listeners (search indexing, notifications, webhooks…) failing for longer than the retry job can fix.
          expr: max by (listener) (diligence_events_publications_incomplete{status="FAILED"}) > 0
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Event listener {{ $labels.listener }} keeps failing; retries have not fixed it"
            runbook: docs/runbooks/failed-events.md
        - alert: DiligenceEventsRetriesExhausted
          expr: max by (listener) (diligence_events_publications_exhausted) > 0
          labels: { severity: critical }
          annotations:
            summary: "Event listener {{ $labels.listener }} gave up on events; they need an operator"
            runbook: docs/runbooks/failed-events.md
        - alert: DiligenceWebhookDeliveriesFailing
          # Deliveries that gave up after their retries, or were refused by the target policy (reason="blocked").
          expr: sum by (subscription, reason) (increase(diligence_webhooks_delivery_failed_total[30m])) > 0
          labels: { severity: warning }
          annotations:
            summary: "Webhook subscription {{ $labels.subscription }}: deliveries gave up ({{ $labels.reason }})"
            runbook: docs/runbooks/webhook-failures.md
