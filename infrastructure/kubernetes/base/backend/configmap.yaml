# Non-secret configuration only. Secrets come from Vault (see vault-secret.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: diligence-backend-config
data:
  APP_ENVIRONMENT: base
  OIDC_ISSUER_URI: https://auth.example.com/realms/diligence
  OIDC_AUDIENCE: diligence-api
  CORS_ALLOWED_ORIGINS: https://app.example.com
  REDIS_SSL_ENABLED: "true"
  RABBITMQ_PORT: "5671"
  SPRING_RABBITMQ_SSL_ENABLED: "true"
  S3_REGION: eu-central-1
  S3_BUCKET: diligence-documents
  S3_PATH_STYLE: "false"
  IDP_BASE_URL: https://auth.example.com
  IDP_REALM: diligence
  APP_BASE_URL: https://app.example.com
  SMTP_HOST: email-smtp.example.com
  SMTP_PORT: "587"
  SMTP_STARTTLS: "true"
  TIKA_URL: http://tika.diligence-processing.svc:9998
  GOTENBERG_URL: http://gotenberg.diligence-processing.svc:3000
  CLAMAV_HOST: clamav.diligence-processing.svc
  # Tesseract languages for scanned documents; "ind" needs a Tika image with that trained data (see ARCHITECTURE §6).
  OCR_LANGUAGES: eng
  WATERMARK_ZONE: Asia/Jakarta
  # PRD REQ-04: request-list reminders on working days at 08:00 WIB for items due within 3 days or overdue.
  REQUEST_REMINDER_CRON: "0 0 8 * * MON-FRI"
  REQUEST_REMINDER_ZONE: Asia/Jakarta
  REQUEST_REMINDER_DAYS_BEFORE: "3"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector.monitoring.svc:4318/v1/traces
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector.monitoring.svc:4318/v1/logs
  TRACING_SAMPLING_PROBABILITY: "0.1"
  API_DOCS_ENABLED: "false"
