# Vault Secrets Operator syncs secrets from Vault (KV v2) into Kubernetes Secrets consumed via envFrom.
#   kv/diligence/<env>/backend/infrastructure  written by Terraform: DB_URL, REDIS_*, RABBITMQ_*, OPENSEARCH_URL
#   kv/diligence/<env>/backend/application     managed by operators: DB_USERNAME, DB_PASSWORD, SENTRY_DSN,
#                                              KEYCLOAK_ADMIN_CLIENT_SECRET, SMTP_USERNAME, SMTP_PASSWORD
# Prefer Vault dynamic database credentials (VaultDynamicSecret) once the database secrets engine is configured.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: diligence-backend
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: diligence-backend
    serviceAccount: diligence-backend
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: diligence-backend-infrastructure
spec:
  vaultAuthRef: diligence-backend
  type: kv-v2
  mount: kv
  path: diligence/base/backend/infrastructure
  refreshAfter: 60s
  destination:
    name: diligence-backend-infrastructure
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: diligence-backend
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: diligence-backend-application
spec:
  vaultAuthRef: diligence-backend
  type: kv-v2
  mount: kv
  path: diligence/base/backend/application
  refreshAfter: 60s
  destination:
    name: diligence-backend-application
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: diligence-backend
