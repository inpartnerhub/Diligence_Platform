# Vault Secrets Operator syncs secrets from Vault (KV v2) into Kubernetes Secrets consumed via envFrom.
#   kv/platform/<env>/backend/infrastructure  written by Terraform: DB_URL, REDIS_*, RABBITMQ_*, OPENSEARCH_URL
#   kv/platform/<env>/backend/application     managed by operators: DB_USERNAME, DB_PASSWORD, SENTRY_DSN
# Prefer Vault dynamic database credentials (VaultDynamicSecret) once the database secrets engine is configured.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: platform-backend
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: platform-backend
    serviceAccount: platform-backend
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: platform-backend-infrastructure
spec:
  vaultAuthRef: platform-backend
  type: kv-v2
  mount: kv
  path: platform/base/backend/infrastructure
  refreshAfter: 60s
  destination:
    name: platform-backend-infrastructure
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: platform-backend
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: platform-backend-application
spec:
  vaultAuthRef: platform-backend
  type: kv-v2
  mount: kv
  path: platform/base/backend/application
  refreshAfter: 60s
  destination:
    name: platform-backend-application
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: platform-backend
