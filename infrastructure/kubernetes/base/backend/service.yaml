apiVersion: v1
kind: Service
metadata:
  name: platform-backend
  labels: { app.kubernetes.io/name: platform-backend }
spec:
  selector: { app.kubernetes.io/name: platform-backend }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: management, port: 8081, targetPort: management }
