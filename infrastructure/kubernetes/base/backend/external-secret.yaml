# External Secrets Operator syncs secrets from AWS Secrets Manager into Kubernetes Secrets consumed via envFrom.
#   diligence/<env>/backend/infrastructure  written by Terraform: DB_URL, REDIS_HOST, REDIS_USERNAME, REDIS_PASSWORD
#   diligence/<env>/backend/application     managed by operators: DB_USERNAME, DB_PASSWORD (runtime login
#                                           diligence_app), FLYWAY_USERNAME, FLYWAY_PASSWORD (schema owner,
#                                           migrations only; #177), SENTRY_DSN,
#                                           KEYCLOAK_ADMIN_CLIENT_SECRET, SMTP_USERNAME, SMTP_PASSWORD, MAIL_FROM,
#                                           WEBHOOK_KEY_ENCRYPTION_KEY (+ _PREVIOUS while rotating; #64)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: diligence-backend-infrastructure
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: diligence-backend-infrastructure
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: diligence/base/backend/infrastructure
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: diligence-backend-application
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: diligence-backend-application
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: diligence/base/backend/application
