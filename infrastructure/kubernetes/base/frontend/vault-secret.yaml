# kv/diligence/<env>/frontend: SESSION_SECRET (>= 32 chars, cookie sealing key), REDIS_URL (rediss://, session store)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: diligence-frontend
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: diligence-frontend
    serviceAccount: diligence-frontend
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: diligence-frontend-secrets
spec:
  vaultAuthRef: diligence-frontend
  type: kv-v2
  mount: kv
  path: diligence/base/frontend
  refreshAfter: 60s
  destination:
    name: diligence-frontend-secrets
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: diligence-frontend
