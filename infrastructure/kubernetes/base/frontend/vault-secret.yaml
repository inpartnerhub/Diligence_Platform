# kv/diligence/<env>/frontend (operators): SESSION_SECRET (>= 32 chars, cookie sealing key),
#                              SESSION_ENCRYPTION_KEY (base64, 32 bytes; encrypts session records in Redis, #172)
#                              + SESSION_ENCRYPTION_KEY_PREVIOUS while rotating,
#                              OIDC_CLIENT_SECRET (secret of the confidential diligence-web client, #175)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: diligence-frontend
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: diligence-frontend
    serviceAccount: diligence-frontend
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: diligence-frontend-secrets
spec:
  vaultAuthRef: diligence-frontend
  type: kv-v2
  mount: kv
  path: diligence/base/frontend
  refreshAfter: 60s
  destination:
    name: diligence-frontend-secrets
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: diligence-frontend
---
# kv/diligence/<env>/frontend-redis, written by Terraform: REDIS_URL with the web app's own ElastiCache user, the only one
# that may read the sessions (diligence:session:*) (#171). Listed after diligence-frontend-secrets in envFrom, so it
# wins over a REDIS_URL left in the operator-managed secret.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: diligence-frontend-redis
spec:
  vaultAuthRef: diligence-frontend
  type: kv-v2
  mount: kv
  path: diligence/base/frontend-redis
  refreshAfter: 60s
  destination:
    name: diligence-frontend-redis
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: diligence-frontend
