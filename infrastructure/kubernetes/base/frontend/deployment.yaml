apiVersion: apps/v1
kind: Deployment
metadata:
  name: diligence-frontend
  labels: { app.kubernetes.io/name: diligence-frontend, app.kubernetes.io/component: web }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: diligence-frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: diligence-frontend, app.kubernetes.io/component: web }
    spec:
      serviceAccountName: diligence-frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: ghcr.io/example/diligence-frontend:latest # pinned by overlays / CI
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: diligence-frontend-config }
            - secretRef: { name: diligence-frontend-secrets }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - name: next-cache
          emptyDir: { sizeLimit: 512Mi }
