# diligence/<env>/frontend (operators): SESSION_SECRET (>= 32 chars, cookie sealing key),
#                                      SESSION_ENCRYPTION_KEY (base64, 32 bytes; encrypts session records in Redis, #172)
#                                      + SESSION_ENCRYPTION_KEY_PREVIOUS while rotating,
#                                      OIDC_CLIENT_SECRET (secret of the confidential diligence-web client, #175)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: diligence-frontend-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: diligence-frontend-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: diligence/base/frontend
---
# diligence/<env>/frontend-redis, written by Terraform: REDIS_URL with the web app's own ElastiCache user, the only
# one that may read the sessions (diligence:session:*) (#171). Listed after diligence-frontend-secrets in envFrom, so
# it wins over a REDIS_URL left in the operator-managed secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: diligence-frontend-redis
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: diligence-frontend-redis
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: diligence/base/frontend-redis
