apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: diligence-staging
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: staging
    includeSelectors: false
images:
  # CI sets immutable digests: kustomize edit set image diligence-backend=ghcr.io/...@sha256:...
  - name: ghcr.io/inpartnerhub/diligence-backend
    newTag: "0.1.0"
  - name: ghcr.io/inpartnerhub/diligence-frontend
    newTag: "0.1.0"
patches:
  - target: { kind: Namespace, name: diligence }
    patch: |-
      - op: replace
        path: /metadata/name
        value: diligence-staging
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
  - target: { kind: VaultStaticSecret, name: diligence-backend-infrastructure }
    patch: |-
      - op: replace
        path: /spec/path
        value: diligence/staging/backend/infrastructure
  - target: { kind: VaultStaticSecret, name: diligence-gateway-redis }
    patch: |-
      - op: replace
        path: /spec/path
        value: diligence/staging/backend/infrastructure
  - target: { kind: VaultStaticSecret, name: diligence-backend-application }
    patch: |-
      - op: replace
        path: /spec/path
        value: diligence/staging/backend/application
  - target: { kind: VaultStaticSecret, name: diligence-frontend-secrets }
    patch: |-
      - op: replace
        path: /spec/path
        value: diligence/staging/frontend
  - target: { kind: VaultStaticSecret, name: opensearch-admin }
    patch: |-
      - op: replace
        path: /spec/path
        value: diligence/staging/opensearch-admin
  - target: { kind: NetworkPolicy, name: opensearch-bootstrap-egress }
    patch: |-
      - op: replace
        path: /spec/egress/0/to/0/ipBlock/cidr
        value: 10.20.0.0/16 # vpc_cidr in infrastructure/terraform/environments/staging/main.tf
  - target: { kind: NetworkPolicy, name: backend-egress-vpc-https }
    patch: |-
      - op: replace
        path: /spec/egress/0/to/0/ipBlock/cidr
        value: 10.20.0.0/16 # vpc_cidr in infrastructure/terraform/environments/staging/main.tf
  - path: config.yaml
  - path: frontend-config.yaml
