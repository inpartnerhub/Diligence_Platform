# Non-secret Keycloak configuration. Database and bootstrap admin credentials come from AWS Secrets Manager
# (see external-secret.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
data:
  KC_DB: postgres
  KC_PROXY_HEADERS: xforwarded
  KC_HTTP_ENABLED: "true"
  KC_METRICS_ENABLED: "true"
  KC_EVENT_METRICS_USER_ENABLED: "true"
  KC_HEALTH_ENABLED: "true"
  KC_HOSTNAME: https://auth.example.com
