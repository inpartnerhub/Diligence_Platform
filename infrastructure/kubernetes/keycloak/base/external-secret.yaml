# External Secrets Operator syncs diligence/<env>/keycloak from AWS Secrets Manager into Kubernetes Secret
# keycloak-secrets (KC_DB_URL, KC_DB_USERNAME, KC_DB_PASSWORD, KC_BOOTSTRAP_ADMIN_USERNAME, KC_BOOTSTRAP_ADMIN_PASSWORD).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: keycloak-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: diligence/base/keycloak
