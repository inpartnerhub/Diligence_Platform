apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: diligence-keycloak-prod
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: prod
    includeSelectors: false
patches:
  - target: { kind: Namespace, name: diligence-keycloak }
    patch: |-
      - op: replace
        path: /metadata/name
        value: diligence-keycloak-prod
  - target: { kind: ExternalSecret, name: keycloak-secrets }
    patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: diligence/prod/keycloak
  - target: { kind: NetworkPolicy, name: keycloak-egress-vpc-db }
    patch: |-
      - op: replace
        path: /spec/egress/0/to/0/ipBlock/cidr
        value: 10.30.0.0/16 # vpc_cidr in infrastructure/terraform/environments/prod/main.tf
  - target: { kind: Ingress, name: keycloak }
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: auth.example.com
      - op: replace
        path: /spec/rules/0/host
        value: auth.example.com
  - path: config.yaml
