# Document-processing services (#92): ClamAV, Apache Tika and Gotenberg parse every uploaded file, including files
# from external users. They run in their own namespace, one per cluster (the backend's TIKA_URL, GOTENBERG_URL and
# CLAMAV_HOST point at diligence-processing in every environment), with no egress except DNS (and HTTPS to the
# internet for ClamAV signature updates), ingress only from the backend, pinned images and resource limits.
#   kubectl apply -k infrastructure/kubernetes/processing
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: diligence-processing
labels:
  - pairs:
      app.kubernetes.io/part-of: diligence
      app.kubernetes.io/component: document-processing
    includeSelectors: false
resources:
  - namespace.yaml
  - network-policies.yaml
  - clamav.yaml
  - tika.yaml
  - gotenberg.yaml
images:
  # Our GHCR builds (infrastructure/docker/{clamav,gotenberg,tika}: upstream bases pinned by digest, security
  # updates, UIDs above 10000), made by the Processing images workflow. GHCR is the only trusted registry
  # (.trivy/data). Pinned by digest (#166), never by a moving tag: these are the images the Processing images run for
  # commit d6ff785 pushed (also tagged sha-d6ff7851464149c9db7e42b106b0c0c0ebea8379). After a new build on main, copy
  # the digests from that run's "pushing manifest for …:main@sha256:…" log lines and update them here and in
  # base/search/kustomization.yaml (Gotenberg) in one pull request; CI refuses images without a digest.
  - name: ghcr.io/inpartnerhub/diligence-clamav
    digest: sha256:6e3a92c9ab9b5d02b129346bad4287aa0e5d14487bb2de8986740e1a2b8ac636
  - name: ghcr.io/inpartnerhub/diligence-gotenberg
    digest: sha256:d7d2159b184f4d666952936b1e53a5800871386c03e42414b5c89027332dff2c
  - name: ghcr.io/inpartnerhub/diligence-tika
    digest: sha256:aea6f78c985b3394181471255b815ec0bda6dd24b72703f29eab93c2206cfc02
