# ClamAV without the image's /init (it chowns and needs root): an init container fetches the signatures, clamd
# scans, and a freshclam sidecar keeps the signatures current; clamd reloads them on its own (SelfCheck).
apiVersion: v1
kind: ConfigMap
metadata:
  name: clamav-config
  namespace: diligence-processing
data:
  clamd.conf: |
    Foreground yes
    TCPSocket 3310
    TCPAddr 0.0.0.0
    DatabaseDirectory /var/lib/clamav
    PidFile /tmp/clamd.pid
    TemporaryDirectory /tmp
    # Logs go to the container output (no LogFile).
    LogTime yes
    # The platform's 100 MB upload limit (clamd's default is 25 MB).
    StreamMaxLength 100M
    MaxFileSize 100M
    SelfCheck 600
    # Reload in place: scans wait during a reload, memory stays at one copy of the signatures.
    ConcurrentDatabaseReload no
  freshclam.conf: |
    DatabaseDirectory /var/lib/clamav
    DatabaseMirror database.clamav.net
    Foreground yes
    Checks 12
    LogTime yes
    PidFile /tmp/freshclam.pid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  namespace: diligence-processing
  labels: { app.kubernetes.io/name: clamav }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: clamav }
  template:
    metadata:
      labels: { app.kubernetes.io/name: clamav }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10100
        runAsGroup: 10100
        fsGroup: 10100
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: signatures
          image: ghcr.io/inpartnerhub/diligence-clamav:main
          command: ["freshclam", "--config-file=/etc/clamav-config/freshclam.conf", "--foreground"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: &mounts
            - { name: config, mountPath: /etc/clamav-config, readOnly: true } # /etc/clamav keeps the image's certs
            - { name: signatures, mountPath: /var/lib/clamav }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: clamd
          image: ghcr.io/inpartnerhub/diligence-clamav:main
          command: ["clamd", "--config-file=/etc/clamav-config/clamd.conf"]
          ports: [{ name: clamd, containerPort: 3310 }]
          resources:
            requests: { cpu: 250m, memory: 2Gi }
            limits: { cpu: "2", memory: 3Gi }
          # clamd accepts TCP before the signatures are loaded; PING only answers once it can scan.
          startupProbe:
            exec: { command: &ping ["clamdscan", "--config-file=/etc/clamav-config/clamd.conf", "--ping", "1"] }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: { command: *ping }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: *ping }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext: *restricted
          volumeMounts: *mounts
        - name: freshclam
          image: ghcr.io/inpartnerhub/diligence-clamav:main
          command: ["freshclam", "--config-file=/etc/clamav-config/freshclam.conf", "--daemon"]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: *restricted
          volumeMounts: *mounts
      volumes:
        - name: config
          configMap: { name: clamav-config }
        - name: signatures
          emptyDir: { sizeLimit: 2Gi }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
  namespace: diligence-processing
  labels: { app.kubernetes.io/name: clamav }
spec:
  selector: { app.kubernetes.io/name: clamav }
  ports: [{ name: clamd, port: 3310, targetPort: clamd }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clamav
  namespace: diligence-processing
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: clamav }
