name: Security

on:
  workflow_dispatch: # re-run on demand, e.g. when GitHub drops a push event
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly, catches newly published CVEs

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # The gitleaks GitHub Action needs a paid license for organization repositories; the CLI does not.
      # The official image pinned by digest (multi-arch index of v8.30.1) instead of the release download, whose
      # checksums.txt GitHub served as 504 for hours. The same command runs locally with Docker.
      - name: Scan git history with gitleaks
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  # Every action is pinned to a commit SHA with its version as a comment (#168); Dependabot updates both. A tag can
  # be moved to other code, a commit cannot. Local actions (./.github/...) and docker:// references are not affected.
  pinned-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Actions are pinned to commit SHAs
        run: |
          unpinned=$(grep -rnE '^\s*-?\s*uses:\s*[^ ./][^ ]*@' .github/workflows \
            | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$unpinned" ]; then
            echo "$unpinned"
            echo "::error::Pin these actions to a full commit SHA (with the version as a comment)"
            exit 1
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  iac-and-filesystem:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with: { sarif_file: trivy-fs.sarif, category: trivy-fs }
