name: Backend

on:
  workflow_dispatch: # re-run on demand, e.g. when GitHub drops a push event
  pull_request:
    paths: ["apps/backend/**", "database/**", ".github/workflows/backend.yml", ".github/workflows/container-image.yml"]
  push:
    branches: [main]
    paths: ["apps/backend/**", "database/**", ".github/workflows/backend.yml", ".github/workflows/container-image.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/backend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # job-level so step `if:` can test it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 } # full history for SonarQube blame data
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Build, unit & modularity tests
        run: ./gradlew build
      - name: Integration tests (Testcontainers)
        run: ./gradlew integrationTest
      - name: SonarQube analysis
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar -Dsonar.host.url="$SONAR_HOST_URL"
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-reports
          path: apps/backend/build/reports
          retention-days: 7

  image:
    needs: build
    uses: ./.github/workflows/container-image.yml
    with:
      image-name: diligence-backend
      context: .
      dockerfile: apps/backend/Dockerfile
      push: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write # keyless cosign signature of the pushed image (#167)
    secrets: inherit
