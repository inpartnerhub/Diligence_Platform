name: Processing images

# Our document-processing images (#92): Apache Tika with Indonesian OCR (infrastructure/docker/tika). Built and
# scanned like the application images; pushed to GHCR from main as sha-<commit> and main.
on:
  workflow_dispatch:
  pull_request:
    paths: ["infrastructure/docker/tika/**", ".github/workflows/processing-images.yml", ".github/workflows/container-image.yml"]
  push:
    branches: [main]
    paths: ["infrastructure/docker/tika/**", ".github/workflows/processing-images.yml", ".github/workflows/container-image.yml"]

permissions:
  contents: read

concurrency:
  group: processing-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tika:
    uses: ./.github/workflows/container-image.yml
    with:
      image-name: diligence-tika
      context: infrastructure/docker/tika
      dockerfile: infrastructure/docker/tika/Dockerfile
      push: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
      security-events: write
    secrets: inherit
