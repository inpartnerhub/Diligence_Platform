name: Processing images

# Our document-processing images (#92): ClamAV, Gotenberg and Apache Tika with Indonesian OCR, rebuilt from
# digest-pinned upstream bases (infrastructure/docker/*). Built and scanned like the application images; pushed
# to GHCR (the only trusted registry) from main as sha-<commit> and main.
on:
  workflow_dispatch:
  pull_request:
    paths: ["infrastructure/docker/clamav/**", "infrastructure/docker/gotenberg/**", "infrastructure/docker/tika/**", ".github/workflows/processing-images.yml", ".github/workflows/container-image.yml"]
  push:
    branches: [main]
    paths: ["infrastructure/docker/clamav/**", "infrastructure/docker/gotenberg/**", "infrastructure/docker/tika/**", ".github/workflows/processing-images.yml", ".github/workflows/container-image.yml"]

permissions:
  contents: read

concurrency:
  group: processing-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tika:
    uses: ./.github/workflows/container-image.yml
    with:
      image-name: diligence-tika
      context: infrastructure/docker/tika
      dockerfile: infrastructure/docker/tika/Dockerfile
      push: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write # keyless cosign signature of the pushed image (#167)
    secrets: inherit
  clamav:
    uses: ./.github/workflows/container-image.yml
    with:
      image-name: diligence-clamav
      context: infrastructure/docker/clamav
      dockerfile: infrastructure/docker/clamav/Dockerfile
      push: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write # keyless cosign signature of the pushed image (#167)
    secrets: inherit
  gotenberg:
    uses: ./.github/workflows/container-image.yml
    with:
      image-name: diligence-gotenberg
      context: infrastructure/docker/gotenberg
      dockerfile: infrastructure/docker/gotenberg/Dockerfile
      push: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write # keyless cosign signature of the pushed image (#167)
    secrets: inherit
