name: Frontend

on:
  workflow_dispatch: # re-run on demand, e.g. when GitHub drops a push event
  pull_request:
    paths: ["apps/frontend/**", ".github/workflows/frontend.yml", ".github/workflows/container-image.yml"]
  push:
    branches: [main]
    paths: ["apps/frontend/**", ".github/workflows/frontend.yml", ".github/workflows/container-image.yml"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/frontend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # job-level so step `if:` can test it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: SonarQube analysis
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8
        with:
          projectBaseDir: apps/frontend
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  image:
    needs: build
    uses: ./.github/workflows/container-image.yml
    with:
      image-name: diligence-frontend
      context: apps/frontend
      dockerfile: apps/frontend/Dockerfile
      push: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write # keyless cosign signature of the pushed image (#167)
    secrets: inherit
