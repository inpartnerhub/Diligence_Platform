name: Performance

# Runs a k6 test from tests/performance against a deployed environment on demand: load.js (pages, preview, search
# and API under load) or upload.js (bulk upload through the ingestion pipeline). The environment's secrets hold a
# dedicated test user (PERF_USER / PERF_PASSWORD) that manages the target project. See tests/performance/README.md
# for profiles, the PRD-scale run on staging and what to exempt from Kong's per-IP rate limit.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging]
        required: true
      test:
        description: Test to run
        type: choice
        options: [load, upload]
        default: load
      profile:
        description: Load profile (load.js only; prd = 1,000 concurrent users, staging only)
        type: choice
        options: [smoke, baseline, stress, prd]
        default: baseline
      upload-files:
        description: Files to upload (upload.js only)
        type: string
        default: "10000"
      project-id:
        description: Project to load (e.g. a seeded PERF-001)
        type: string
        required: true
      preview-project-id:
        description: Project with rendered documents for the viewer scenario (defaults to project-id)
        type: string
        required: false
      preview-folder-id:
        description: Folder with rendered documents for the viewer scenario, e.g. the bulk-upload folder (optional)
        type: string
        required: false
      runner:
        description: Runner label; the prd profile needs ≥ 4 vCPU (a larger or self-hosted runner)
        type: string
        default: ubuntu-latest

permissions:
  contents: read

concurrency:
  group: performance-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  k6:
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    # upload.js waits up to 2 h for the uploads and 2 h for the pipeline to drain.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Run k6
        working-directory: tests/performance
        env:
          APP_URL: ${{ vars.PERF_APP_URL }}
          API_URL: ${{ vars.PERF_API_URL }}
          OIDC_ISSUER: ${{ vars.PERF_OIDC_ISSUER }}
          PROJECT_ID: ${{ inputs.project-id }}
          PREVIEW_PROJECT_ID: ${{ inputs.preview-project-id }}
          PREVIEW_FOLDER_ID: ${{ inputs.preview-folder-id }}
          K6_USER: ${{ secrets.PERF_USER }}
          K6_PASSWORD: ${{ secrets.PERF_PASSWORD }}
          PROFILE: ${{ inputs.profile }}
          UPLOAD_FILES: ${{ inputs.upload-files }}
          TEST: ${{ inputs.test }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/scripts" -w /scripts \
            -e APP_URL -e API_URL -e OIDC_ISSUER -e PROJECT_ID -e PREVIEW_PROJECT_ID -e PREVIEW_FOLDER_ID -e K6_USER -e K6_PASSWORD \
            -e PROFILE -e UPLOAD_FILES \
            grafana/k6:2.3.0 run --summary-export summary.json "$TEST.js"
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-${{ inputs.environment }}-${{ inputs.test }}-${{ inputs.test == 'upload' && inputs.upload-files || inputs.profile }}
          path: tests/performance/summary.json
          if-no-files-found: ignore
