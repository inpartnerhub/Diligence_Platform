name: Deploy

# Promotion template: deploys immutable images (by git SHA) to an environment. Each GitHub environment
# (dev / staging / prod) holds its own cloud credentials and protection rules (prod requires approval).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        required: true
      image-tag:
        description: Image tag to deploy (sha-<full git sha>)
        type: string
        required: true

permissions:
  contents: read
  id-token: write # OIDC federation to the cloud provider; no long-lived credentials
  packages: read # resolve image tags to digests in GHCR (#166)

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      OVERLAY: infrastructure/kubernetes/overlays/${{ inputs.environment }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
      # Cluster access without stored credentials (#164): the job's OIDC token for this GitHub environment is exchanged
      # for the environment's deploy role (Terraform output deploy_role_arn, stored as the environment variable
      # AWS_DEPLOY_ROLE_ARN together with AWS_REGION). In the cluster that role may only apply the overlay's kinds in
      # diligence-<env> (infrastructure/kubernetes/rbac).
      - name: Check the environment's deploy settings
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          if [ -z "$ROLE" ] || [ -z "$REGION" ]; then
            echo "::error::Set the variables AWS_DEPLOY_ROLE_ARN and AWS_REGION on the GitHub environment"
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}
      - name: Cluster credentials
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REGION: ${{ vars.AWS_REGION }}
        run: aws eks update-kubeconfig --name "diligence-$ENVIRONMENT" --region "$REGION"
      # A fixed kustomize release, verified against the checksum published with it (#165). This job can mint cloud
      # credentials, so it never runs an installer script fetched from a branch. Update version and checksum together
      # (checksums.txt of the release).
      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: v5.8.3
          KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
        run: |
          archive="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/$archive"
          echo "$KUSTOMIZE_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" kustomize
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Deploy by digest (#166): the tag is resolved once, here, and the cluster runs exactly that image even if the tag
      # were moved later. The resolved digests are printed in the job log as the deployment record.
      - name: Pin images by digest
        working-directory: ${{ env.OVERLAY }}
        env:
          IMAGE_TAG: ${{ inputs.image-tag }} # through the environment, not interpolated into the script
        run: |
          for app in backend frontend; do
            digest=$(docker buildx imagetools inspect "$REGISTRY/diligence-$app:$IMAGE_TAG" --format '{{json .Manifest}}' \
              | jq -r .digest)
            case "$digest" in sha256:*) ;; *) echo "::error::No digest for diligence-$app:$IMAGE_TAG"; exit 1 ;; esac
            echo "diligence-$app:$IMAGE_TAG -> $digest"
            kustomize edit set image "ghcr.io/inpartnerhub/diligence-$app=$REGISTRY/diligence-$app@$digest"
          done
      - name: Diff
        run: kubectl diff -k "$OVERLAY" || true
      - name: Apply
        run: |
          kubectl apply -k "$OVERLAY"
          kubectl -n diligence-${{ inputs.environment }} rollout status deploy/diligence-backend --timeout=10m
          kubectl -n diligence-${{ inputs.environment }} rollout status deploy/diligence-ingestion --timeout=10m
          kubectl -n diligence-${{ inputs.environment }} rollout status deploy/diligence-frontend --timeout=5m
