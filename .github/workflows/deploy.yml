name: Deploy

# Promotion template: deploys immutable images (by git SHA) to an environment. Each GitHub environment
# (dev / staging / prod) holds its own cloud credentials and protection rules (prod requires approval).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        required: true
      image-tag:
        description: Image tag to deploy (sha-<full git sha>)
        type: string
        required: true

permissions:
  contents: read
  id-token: write # OIDC federation to the cloud provider; no long-lived credentials

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      OVERLAY: infrastructure/kubernetes/overlays/${{ inputs.environment }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
      # Configure cluster access here, e.g. aws-actions/configure-aws-credentials with role-to-assume
      # followed by `aws eks update-kubeconfig --name diligence-${{ inputs.environment }}`.
      # A fixed kustomize release, verified against the checksum published with it (#165). This job can mint cloud
      # credentials, so it never runs an installer script fetched from a branch. Update version and checksum together
      # (checksums.txt of the release).
      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: v5.8.3
          KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
        run: |
          archive="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/$archive"
          echo "$KUSTOMIZE_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" kustomize
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Pin images
        working-directory: ${{ env.OVERLAY }}
        env:
          IMAGE_TAG: ${{ inputs.image-tag }} # through the environment, not interpolated into the script
        run: |
          kustomize edit set image \
            "ghcr.io/inpartnerhub/diligence-backend=$REGISTRY/diligence-backend:$IMAGE_TAG" \
            "ghcr.io/inpartnerhub/diligence-frontend=$REGISTRY/diligence-frontend:$IMAGE_TAG"
      - name: Diff
        run: kubectl diff -k "$OVERLAY" || true
      - name: Apply
        run: |
          kubectl apply -k "$OVERLAY"
          kubectl -n diligence-${{ inputs.environment }} rollout status deploy/diligence-backend --timeout=10m
          kubectl -n diligence-${{ inputs.environment }} rollout status deploy/diligence-ingestion --timeout=10m
          kubectl -n diligence-${{ inputs.environment }} rollout status deploy/diligence-frontend --timeout=5m
