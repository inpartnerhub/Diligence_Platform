name: Container image

# Reusable: builds an image, scans it with Trivy and (optionally) pushes it to GHCR with provenance + SBOM.
on:
  workflow_call:
    inputs:
      image-name: { type: string, required: true }
      context: { type: string, required: true }
      dockerfile: { type: string, required: true }
      push: { type: boolean, default: false }

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: ${{ inputs.push }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=pr
            type=raw,value=main,enable={{is_default_branch}}
      - name: Build (load for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy.sarif
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: { sarif_file: trivy.sarif, category: "trivy-${{ inputs.image-name }}" }
      - name: Push
        if: ${{ inputs.push }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image-name }}
          provenance: mode=max
          sbom: true
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
