name: Infrastructure

on:
  pull_request:
    paths: ["infrastructure/**", "compose.yaml", ".github/workflows/infrastructure.yml"]
  push:
    branches: [main]
    paths: ["infrastructure/**", "compose.yaml", ".github/workflows/infrastructure.yml"]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    defaults:
      run:
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6
      - run: tflint --init --config "$GITHUB_WORKSPACE/infrastructure/terraform/.tflint.hcl" && tflint --recursive --config "$GITHUB_WORKSPACE/infrastructure/terraform/.tflint.hcl"
        working-directory: infrastructure/terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
      - name: Render and validate overlays
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          for dir in overlays/dev overlays/staging overlays/prod processing; do
            kubectl kustomize "infrastructure/kubernetes/$dir" | ./kubeconform -strict -summary \
              -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
      - name: Rate-limiting plugins have a counter store Kong accepts
        # Kong rejects policy "redis" without config.redis.host, and the ingress then runs without a per-address
        # limit (#139). kubeconform cannot see this: the KongPlugin config is free-form.
        run: |
          for dir in overlays/dev overlays/staging overlays/prod; do
            bad=$(kubectl kustomize "infrastructure/kubernetes/$dir" | yq ea -N 'select(.kind == "KongPlugin" and
              (.plugin == "rate-limiting" or .plugin == "rate-limiting-advanced") and .config.policy == "redis"
              and (.config.redis.host // "") == "") | .metadata.name')
            if [ -n "$bad" ]; then
              echo "::error::$dir: rate-limiting plugin(s) with policy redis but no config.redis.host: $bad"
              exit 1
            fi
          done

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env && docker compose --profile app --profile observability config -q
      - name: clamd reports unscannable content in compose and Kubernetes (#140)
        run: |
          for setting in "AlertExceedsMax yes" "AlertEncryptedArchive yes"; do
            grep -q "^    $setting$" infrastructure/kubernetes/processing/clamav.yaml \
              || { echo "::error::clamav.yaml must set $setting"; exit 1; }
            key=${setting% *}
            [ "$(docker compose config --format json | jq -r ".services.clamav.environment.CLAMD_CONF_$key")" = yes ] \
              || { echo "::error::compose.yaml must set CLAMD_CONF_$key: yes"; exit 1; }
          done

  alert-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check alert rules (compose and Kubernetes) and that both files hold the same rules
        run: |
          image=$(grep -o 'prom/prometheus:[^ "]*' compose.yaml | head -1)
          yq '{"groups": .spec.groups}' infrastructure/kubernetes/base/backend/prometheusrule.yaml > /tmp/k8s-rules.yml
          docker run --rm --entrypoint promtool -v "$PWD/infrastructure/docker/prometheus:/r:ro" -v /tmp:/s:ro "$image" \
            check rules /r/alerts.yml /s/k8s-rules.yml
          diff <(yq '.groups' infrastructure/docker/prometheus/alerts.yml) <(yq '.groups' /tmp/k8s-rules.yml)
