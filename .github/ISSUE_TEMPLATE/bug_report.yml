name: Bug report
description: Report a defect
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: "What happened?", description: "Include steps to reproduce." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behaviour }
  - type: input
    id: environment
    attributes: { label: Environment, placeholder: "local / dev / staging / prod" }
